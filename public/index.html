<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zalo Bot Tiên Sơn Hà Tây</title>
    <style>
      :root {
        --brand-1: #a72608;
        --brand-2: #d8572a;
        --ink: #1f2937;
        --paper: #fffaf4;
        --muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at top right, #ffe8d6 0%, var(--paper) 45%, #f6f3ee 100%);
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .chat {
        width: min(900px, 100%);
        min-height: 80vh;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #f5d4c1;
        border-radius: 24px;
        box-shadow: 0 24px 50px rgba(167, 38, 8, 0.15);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
      }

      .chat-header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px;
        background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
        color: #fff;
      }

      .chat-header img {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(255, 255, 255, 0.7);
      }

      .chat-header h1 {
        margin: 0;
        font-size: clamp(1rem, 2.5vw, 1.4rem);
      }

      .chat-header p {
        margin: 2px 0 0;
        opacity: 0.92;
      }

      .hero {
        padding: 18px 20px 0;
        color: var(--ink);
        background: #fff;
      }

      .fixed-actions {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        padding: 0 20px 18px;
      }

      .fixed-actions button {
        border: 1px solid var(--brand-2);
        background: #fff;
        color: var(--brand-1);
        padding: 10px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
      }

      .hero h2 {
        margin: 0 0 8px;
        font-size: 1rem;
      }

      .hero p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
      }

      .video-card {
        margin: 16px 20px 0;
        padding: 14px;
        border-radius: 16px;
        border: 1px solid #f3e2d4;
        background: #fffaf4;
      }

      .video-card video {
        width: 100%;
        border-radius: 12px;
      }

      .messages {
        padding: 18px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .bubble {
        max-width: 80%;
        padding: 12px 14px;
        border-radius: 14px;
        line-height: 1.45;
        white-space: pre-line;
      }

      .user {
        align-self: flex-end;
        background: #eceff4;
      }

      .bot {
        align-self: flex-start;
        background: #fff5ef;
        border: 1px solid #ffd7bf;
      }

      .quick {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .quick button {
        border: 1px solid var(--brand-2);
        background: #fff;
        color: var(--brand-1);
        padding: 8px 10px;
        border-radius: 999px;
        cursor: pointer;
      }

      .composer {
        padding: 14px;
        border-top: 1px solid #f3ece7;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      input,
      button.send {
        font: inherit;
      }

      input {
        border: 1px solid #d2d6db;
        border-radius: 12px;
        padding: 12px;
      }

      button.send {
        border: none;
        border-radius: 12px;
        background: var(--brand-1);
        color: #fff;
        padding: 12px 16px;
        cursor: pointer;
      }

      @media (max-width: 640px) {
        .chat {
          min-height: 90vh;
        }

        .bubble {
          max-width: 92%;
        }
      }
    </style>
  </head>
  <body>
    <main class="chat">
      <header class="chat-header">
        <img src="/logo.jpg" alt="Logo công ty" />
        <div>
          <h1>Công ty Cổ phần xi măng tiên Sơn Hà Tây</h1>
          <p>Trợ lý đặt hàng, tư vấn sỉ và công nợ 24/7</p>
        </div>
      </header>

      <section class="hero">
        <div class="fixed-actions">
          <button type="button" id="startButton">Start</button>
          <button type="button" id="priceButton">💲 Tra cứu bảng giá</button>
          <button type="button" id="orderButton">📝 Đặt hàng</button>
          <button type="button" id="creditButton">🤝 Tư vấn Sỉ & Công nợ</button>
          <button type="button" id="trackingButton">🚚 Theo dõi vận chuyển</button>
        </div>
      </section>

    

      <template id="orderFormTemplate">
        <div class="order-form-card" style="padding:12px;border:1px solid #e8e8e8;border-radius:12px;background:#fff;">
          <p class="order-title">Chọn sản phẩm và nhập số lượng</p>
          <div id="orderRows"></div>
          <button id="addProductBtn" class="mini-btn" type="button">+ Thêm sản phẩm</button>
          <div class="form-actions" style="margin-top:12px;">
            <button id="submitOrderBtn" class="primary-btn" type="button">Xác nhận đặt hàng</button>
          </div>
        </div>
      </template>

      <section id="messages" class="messages"></section>

      <form id="composer" class="composer">
        <input id="input" placeholder="Nhập nội dung (ví dụ: menu)" autocomplete="off" />
        <button class="send" type="submit">Gửi</button>
      </form>
    </main>

    <script>
      const messages = document.getElementById("messages");
      const form = document.getElementById("composer");
      const input = document.getElementById("input");

      function appendMessage(text, who, quickReplies = []) {
        const container = document.createElement("div");
        const bubble = document.createElement("div");
        bubble.className = `bubble ${who}`;
        bubble.textContent = text;
        container.appendChild(bubble);

        if (who === "bot" && quickReplies.length) {
          const quick = document.createElement("div");
          quick.className = "quick";
          quickReplies.forEach((item) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = item.title;
            btn.addEventListener("click", () => sendMessage(item.title));
            quick.appendChild(btn);
          });
          container.appendChild(quick);
        }

        messages.appendChild(container);
        messages.scrollTop = messages.scrollHeight;
      }

      async function sendMessage(text) {
        if (!text.trim()) {
          return;
        }

        appendMessage(text, "user");

        const response = await fetch("/api/chat/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: "demo-user", userName: "Khách Demo", text })
        });

        const data = await response.json();
        appendMessage(data.text, "bot", data.quickReplies || []);
      }

      document.getElementById("startButton").addEventListener("click", () => sendMessage("/start"));
      document.getElementById("orderButton").addEventListener("click", () => sendMessage("đặt hàng"));
      document.getElementById("creditButton").addEventListener("click", () => sendMessage("tư vấn sỉ"));
      document.getElementById("trackingButton").addEventListener("click", () => sendMessage("theo dõi vận chuyển"));

      // Render order form from template when user clicks orderButton (also accessible from quick replies)
      const orderButton = document.getElementById("orderButton");
      const template = document.getElementById("orderFormTemplate");
      let orderForm = null;

      function createOrderRow(products) {
        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.gap = '8px';
        row.style.marginBottom = '8px';

        const select = document.createElement('select');
        products.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.name;
          opt.textContent = p.name;
          opt.dataset.units = JSON.stringify(p.allowedUnits || ['bao', 'tấn', 'viên']);
          select.appendChild(opt);
        });

        const qty = document.createElement('input');
        qty.type = 'number';
        qty.min = '1';
        qty.placeholder = 'Số lượng';
        qty.style.width = '100px';

        const unit = document.createElement('select');
        const fillUnits = (units) => {
          unit.innerHTML = '';
          units.forEach(u => {
            const o = document.createElement('option'); o.value = u; o.textContent = u; unit.appendChild(o);
          });
        };

        const initialUnits = JSON.parse(select.selectedOptions[0]?.dataset.units || "['bao','tấn','viên']");
        fillUnits(initialUnits);
        select.addEventListener('change', () => {
          const units = JSON.parse(select.selectedOptions[0]?.dataset.units || "['bao','tấn','viên']");
          fillUnits(units);
        });

        const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = 'X';
        remove.addEventListener('click', () => row.remove());

        row.appendChild(select);
        row.appendChild(qty);
        row.appendChild(unit);
        row.appendChild(remove);
        return row;
      }

      async function openOrderForm() {
        if (orderForm) return; // already open
        const clone = template.content.cloneNode(true);
        orderForm = clone.querySelector('.order-form-card');
        const orderRows = orderForm.querySelector('#orderRows');
        const addBtn = orderForm.querySelector('#addProductBtn');
        const submitBtn = orderForm.querySelector('#submitOrderBtn');

        // load products from server
        const resp = await fetch('/api/chat/message', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ userId: 'demo-user', userName: 'Khách Demo', text: 'menu' })});
        const data = await resp.json();
        // fallback products
        const respProducts = await fetch('/api/products');
        const products = await respProducts.json().catch(() => [
          { name: 'Xi Măng PCB30', allowedUnits: ['bao', 'tấn'] },
          { name: 'Xi Măng PCB40', allowedUnits: ['bao', 'tấn'] },
          { name: 'Xi Măng Xây Trát', allowedUnits: ['bao', 'tấn'] },
          { name: 'Gạch Không Nung', allowedUnits: ['viên'] }
        ]);

        orderRows.appendChild(createOrderRow(products));

        addBtn.addEventListener('click', () => {
          orderRows.appendChild(createOrderRow(products));
        });

        submitBtn.addEventListener('click', async () => {
          const rows = Array.from(orderRows.children);
          const items = rows.map(r => {
            const s = r.querySelector('select');
            const q = r.querySelector('input');
            const u = r.querySelectorAll('select')[1];
            return { product: s.value, quantity: Number(q.value || 0), unit: u.value };
          }).filter(it => it.quantity > 0);

          if (!items.length) {
            alert('Vui lòng nhập ít nhất 1 sản phẩm hợp lệ.');
            return;
          }

          const phone = prompt('Nhập số điện thoại liên hệ (bắt đầu 0):');
          const address = prompt('Nhập địa chỉ nhận hàng:');

          const result = await fetch('/api/order', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ userId: 'web-user', userName: 'Khách Web', items, phone, address })
          });

          const json = await result.json();
          appendMessage(json.text || 'Đã gửi đơn.', 'bot');
          // close form
          orderForm.remove(); orderForm = null;
        });

        messages.prepend(orderForm);
      }

      document.getElementById('priceButton').addEventListener('click', () => sendMessage('tra cứu bảng giá'));
      orderButton.addEventListener('click', () => {
        // open visual order form
        openOrderForm().catch(console.error);
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const value = input.value;
        input.value = "";
        sendMessage(value);
      });

      sendMessage("menu");
    </script>
  </body>
</html>
